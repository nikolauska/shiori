[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
shiori-core = { path = "crates/shiori-core" }
shiori-detect = { path = "crates/shiori-detect" }
shiori-store = { path = "crates/shiori-store" }
shiori-sync = { path = "crates/shiori-sync" }
shiori-library = { path = "crates/shiori-library" }

anitomy-ng = "=1.0.10"
bitflags = { version = "2.13.2", features = ["serde"] }
caseless = "0.2.2"
directories = "6.0.0"
jiff = { version = "0.2.43", features = ["serde"] }
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
unicode-normalization = "0.1.26"
unicode-properties = "0.1.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
