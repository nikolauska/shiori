[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
shiori-core = { path = "crates/shiori-core" }
shiori-detect = { path = "crates/shiori-detect" }
shiori-store = { path = "crates/shiori-store" }
shiori-sync = { path = "crates/shiori-sync" }
shiori-library = { path = "crates/shiori-library" }

anitomy-ng = "=1.0.10"
anyhow = "1.0.105"
bitflags = { version = "2.13.2", features = ["serde"] }
caseless = "0.2.2"
directories = "6.0.0"
# The UI framework. gpui-component 0.9.1 builds on gpui-pre, a snapshot of
# Zed's gpui; update the three together.
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "=0.11.0"
# The icons gpui-component draws; without them icon buttons are blank.
gpui-kit-assets = "=0.11.0"
# Picks the episode for "Random episode" and the anime for "Play random
# anime"; already in the tree through gpui.
fastrand = "2.5.0"
# Reads MyAnimeList's gzipped list exports; already in the tree through
# reqwest's gzip support.
flate2 = "1.1.11"
# Decodes the app icon for the window and the tray; gpui uses it already.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The Linux display backends are opt-in features; without them gpui
# starts headless and no window ever appears.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["wayland", "x11"] }
keyring = "4.2.0"
jiff = { version = "1.0.3", features = ["serde"] }
regex = "1.13.2"
# Reads MyAnimeList XML list exports; already in the tree through gpui.
roxmltree = "0.21.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "socks", "gzip", "json"] }
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
toml = "1.2.3"
toml_edit = "0.25.21"
# Tray icon (decision I15). Only the gtk feature: libxdo is for menu
# accelerators, which the tray menu does not use.
# The tray icon needs a GTK main loop on Linux; same version as tray-icon uses.
gtk = "0.19.0"
tray-icon = { version = "0.27.0", default-features = false, features = ["libappindicator"] }
# The "Confirm list update" notification. gpui already uses this version
# on Linux.
notify-rust = { version = "4.19.0", default-features = false, features = ["z"] }
tracing = "0.1.44"
# Deleting from the Library page moves files to the trash or Recycle Bin,
# so that a slip can be undone.
trash = { version = "5.4.0", default-features = false, features = ["freedesktop", "coinit_apartmentthreaded"] }
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
unicode-properties = "0.1.5"
# Detection on Windows: window listing, open files and UI Automation;
# also the console for the command-line mode.
windows = { version = "0.62.2", features = [
    "Wdk_Foundation",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
# Detection on Linux: window titles under X11. Pure Rust, no libxcb.
x11rb = "0.14.0"
# Detection on Linux: MPRIS on the session bus. zbus 6 dropped the blocking
# API; its default-rt runtime and block_on keep detection off tokio.
zbus = { version = "6.5.0", default-features = false, features = ["default-rt", "proxy"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
