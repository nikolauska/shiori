[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
shiori-core = { path = "crates/shiori-core" }
shiori-detect = { path = "crates/shiori-detect" }
shiori-store = { path = "crates/shiori-store" }
shiori-sync = { path = "crates/shiori-sync" }
shiori-library = { path = "crates/shiori-library" }

anitomy-ng = "=1.0.10"
anyhow = "1.0.104"
bitflags = { version = "2.13.2", features = ["serde"] }
caseless = "0.2.2"
directories = "6.0.0"
# The UI framework. gpui-component 0.9.1 builds on gpui-pre, a snapshot of
# Zed's gpui; update the three together.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
# The icons gpui-component draws; without them icon buttons are blank.
gpui-kit-assets = "=0.9.1"
# Decodes the app icon for the window and the tray; gpui uses it already.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The Linux display backends are opt-in features; without them gpui
# starts headless and no window ever appears.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
keyring = "4.2.0"
jiff = { version = "0.2.43", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "socks", "gzip", "json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
toml = "1.2.1"
toml_edit = "0.25.19"
# Tray icon (decision I15). Only the gtk feature: libxdo is for menu
# accelerators, which the tray menu does not use.
# The tray icon needs a GTK main loop on Linux; same version as tray-icon uses.
gtk = "0.18.2"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
unicode-properties = "0.1.5"
# Detection on Windows: window listing, open files and UI Automation.
windows = { version = "0.62.2", features = [
    "Wdk_Foundation",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
# Detection on Linux: window titles under X11. Pure Rust, no libxcb.
x11rb = "0.13.2"
# Detection on Linux: MPRIS on the session bus. gpui already pulls in this
# version with async-io; the blocking API keeps detection off any runtime.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
