name: Release

# Pushing a tag like v0.2.0 builds Shiori for Windows and Linux and
# publishes a GitHub release with both downloads attached.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # A tag that disagrees with Cargo.toml would publish an app whose
      # About dialog and --help show a different version than the release.
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "shiori-app") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          # The oldest supported runner, so the binary links against an old
          # glibc and starts on older distributions too.
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: shiori-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # Same libraries as in ci.yml: gpui needs X11, Wayland and fonts; the
      # tray icon needs GTK 3 and an appindicator library.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev
          libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype-dev
          libgtk-3-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p shiori-app

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:PACKAGE | Out-Null
          Copy-Item target/release/shiori.exe, LICENSE, README.md $env:PACKAGE
          Compress-Archive -Path $env:PACKAGE -DestinationPath "$env:PACKAGE.zip"
      # The installer adds a Start menu entry and an uninstaller, and updates
      # an earlier install in place; the zip stays for people who want to
      # run Shiori from a folder of their own. GitHub's Windows images
      # usually come with Inno Setup; install it when this one does not.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $default)) { choco install innosetup --no-progress -y }
            $iscc = $default
          }
          & $iscc /Qp "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceDir=$PWD\target\release" packaging\windows\shiori.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The icon and the .desktop file let users add Shiori to their app
      # menu; the binary itself needs neither.
      - if: runner.os == 'Linux'
        run: |
          mkdir "$PACKAGE"
          cp target/release/shiori LICENSE README.md "$PACKAGE/"
          cp assets/icon.png "$PACKAGE/shiori.png"
          cp packaging/linux/shiori.desktop "$PACKAGE/"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}-setup.exe
            ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # A tag with a suffix such as v0.2.0-beta.1 is a test build, so it is
      # marked as a pre-release and GitHub keeps pointing "latest" at the
      # last stable one.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Shiori ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
